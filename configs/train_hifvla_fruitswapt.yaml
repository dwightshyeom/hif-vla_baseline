# HiF-VLA fine-tuning config for the FruitSwapVision (robosuite) task.
#
# These values are passed to finetune_fruitswapt.py via draccus CLI args.
# You can override any field on the command line:
#
#   accelerate launch --num_processes <N_GPU> \
#       baseline/training/finetune_fruitswapt.py \
#       --config configs/train_hifvla_fruitswapt.yaml
#
# IMPORTANT: run the script from the HiF-VLA/ subdirectory so that
# check_model_logic_mismatch() can locate ./prismatic/ correctly.
#
# Workflow:
#   Step 1 — convert dataset:
#     python baseline/dataset/convert_robosuite_to_zarr.py \
#         --input /path/to/demo.hdf5 \
#         --output /path/to/fruit_swap_zarr \
#         --image-size 96
#
#   Step 2 — train:
#     accelerate launch --num_processes <N_GPU> \
#         baseline/training/finetune_fruitswapt.py \
#         --config configs/train_hifvla_fruitswapt.yaml
#
#   Step 3 — evaluate:
#     python baseline/eval/run_fruitswapt_eval.py \
#         --pretrained_checkpoint <run_root_dir>/<run_id>--<step>_chkpt \
#         --flow_stats_path <run_root_dir>/<run_id>/flow_stats.npz \
#         --unnorm_key fruit_swap_vision \
#         --num_episodes 50

# --- Paths ---
# Set these to absolute paths or paths relative to the repo root.
vla_path: "openvla/openvla-7b"          # HF Hub id or local path to base weights
zarr_path: "/home/arclab/HIF-VLA_baseline/robosuite_pomdp/custom_dataset/FruitSwapVision"   # output of convert_robosuite_to_zarr.py
run_root_dir: "runs/fruitswapt_hifvla"

# Flow caches are placed next to the zarr store by default.
# Set explicit paths here to override (useful when zarr is read-only).
# flow_cache_path: "/path/to/flow_cache.npy"
# flow_stats_path: "/path/to/flow_stats.npz"

# --- Architecture ---
use_l1_regression: true
use_film: false
num_images_in_input: 1
use_proprio: true

# --- HiF-VLA motion encoder ---
history_length: 8

# --- LoRA ---
use_lora: true
lora_rank: 32
lora_dropout: 0.0
merge_lora_during_training: false

# --- Training ---
batch_size: 1
grad_accumulation_steps: 16        # effective batch = 16
learning_rate: 5.0e-4
lr_warmup_steps: 500
num_steps_before_decay: 50000
max_steps: 50005
save_freq: 10000
save_latest_checkpoint_only: false
image_aug: true
val_fraction: 0.1
use_val_set: false
val_freq: 5000
val_time_limit: 120

# --- In-training rollout (disabled by default; use run_fruitswapt_eval.py) ---
rollout_freq: 0
rollout_unnorm_key: "fruit_swap_vision"
n_rollout_episodes: 3
rollout_max_steps: 600
rollout_num_open_loop: 8

# --- Logging ---
wandb_entity: "seansyeom3"   # <-- replace with your W&B entity
wandb_project: "hifvla-fruitswapt"
wandb_log_freq: 10
