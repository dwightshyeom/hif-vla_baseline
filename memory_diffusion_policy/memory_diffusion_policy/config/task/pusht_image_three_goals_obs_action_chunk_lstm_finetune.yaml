name: pusht_image_three_goals_obs_action_chunk_lstm_finetune

image_shape: &image_shape [3, 96, 96]
shape_meta: &shape_meta
  obs:
    image:
      shape: *image_shape
      type: rgb
    agent_pos:
      shape: [2]
      type: low_dim
  action:
    shape: [2]

env_runner:
  _target_: memory_diffusion_policy.env_runner.pusht_image_three_goals_runner.PushTImageThreeGoalsRunner
  n_train: 6
  n_train_vis: 6
  train_start_seed: 0
  n_test: 50
  n_test_vis: 50
  legacy_test: True
  test_start_seed: 100000
  max_steps: 900
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 10
  past_action: ${past_action_visible}
  # Rollout knobs (overridable from the top-level workspace yaml):
  #   n_envs        — how many envs run in parallel each chunk.
  #                   null → n_train+n_test (full parallel, original behavior).
  #                   small int (e.g. 2) pairs with rollout_mode=local for
  #                   constrained machines.
  #   rollout_mode  — "wandb" (upload videos to wandb) or "local" (save videos
  #                   to <output_dir>/epoch_<E>_rollout/ on disk; wandb still
  #                   gets the numerical metrics).
  n_envs: ${oc.select:rollout_n_envs,null}
  rollout_mode: ${oc.select:rollout_mode,wandb}

dataset:
  _target_: memory_diffusion_policy.dataset.obs_action_chunk_lstm_image_finetune_dataset.ObsActionChunkLSTMImageFinetuneDataset
  zarr_path: data/pusht_three_goals_demo_vision_320.zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.02
  max_train_episodes: null
  lstm_checkpoint_path: ${lstm_checkpoint_path}
  lstm_normalizer_path: null
  device: ${training.device}
