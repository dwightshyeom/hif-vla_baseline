name: pusht_image_friction_three_tracks_obs_action_chunk_lstm

image_shape: &image_shape [3, 96, 96]
shape_meta: &shape_meta
  obs:
    image:
      shape: *image_shape
      type: rgb
    agent_pos:
      shape: [2]
      type: low_dim
  action:
    shape: [2]

env_runner:
  _target_: memory_diffusion_policy.env_runner.pusht_image_friction_three_tracks_runner.PushTImageFrictionThreeTracksRunner
  n_train: 6
  n_train_vis: 6
  train_start_seed: 0
  n_test: 50
  n_test_vis: 50
  legacy_test: False
  test_start_seed: 100000
  max_steps: 1500
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 10
  past_action: ${past_action_visible}
  n_envs: ${oc.select:rollout_n_envs,null}
  rollout_mode: ${oc.select:rollout_mode,wandb}
  debug_show_friction: False

# Frozen-LSTM dataset: state[:, :2] is auto-sliced for agent_pos so the
# friction zarr's wider state schema (5D = agent + block pose) plugs in
# unchanged. Same pattern as the 2-track friction LSTM config.
dataset:
  _target_: memory_diffusion_policy.dataset.obs_action_chunk_lstm_image_chunked_latent_dataset.ObsActionChunkLSTMImageChunkedLatentDataset
  zarr_path: data/pusht_friction_three_tracks_demo.zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.02
  max_train_episodes: null
  lstm_checkpoint_path: ${lstm_checkpoint_path}
  action_step_subsample: ${action_step_subsample}
  lstm_latent_type: ${lstm_latent_type}
  device: ${training.device}
