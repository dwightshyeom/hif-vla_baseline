name: pusht_image_two_swap_obs_action_chunk_lstm

image_shape: &image_shape [3, 96, 96]
shape_meta: &shape_meta
  obs:
    image:
      shape: *image_shape
      type: rgb
    agent_pos:
      shape: [2]
      type: low_dim
  action:
    shape: [2]

env_runner:
  _target_: memory_diffusion_policy.env_runner.pusht_image_two_swap_runner.PushTImageTwoSwapRunner
  n_train: 6
  n_train_vis: 6
  train_start_seed: 0
  n_test: 50
  n_test_vis: 50
  legacy_test: False
  test_start_seed: 100000
  max_steps: 500
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 10
  past_action: ${past_action_visible}
  # Rollout knobs (overridable from the top-level workspace yaml):
  #   n_envs        — envs in parallel per chunk. null → n_train+n_test.
  #                   Pair a small int with rollout_mode=local on RAM-tight boxes.
  #   rollout_mode  — "wandb" (upload videos to wandb) or "local"
  #                   (save to <output_dir>/epoch_<E>_rollout/; wandb still
  #                   gets the numerical metrics).
  n_envs: ${oc.select:rollout_n_envs,null}
  rollout_mode: ${oc.select:rollout_mode,wandb}
  blue_start_side: 'random'

# LSTM+DP "chunked latent" stage: the LSTM has already been pretrained and
# its latents are precomputed per-chunk on disk. Uses the shared chunked-
# latent image dataset — the zarr layout is the standard {img, state, action}
# plus the precomputed latents, same as the three-goals variant.
dataset:
  _target_: memory_diffusion_policy.dataset.obs_action_chunk_lstm_image_chunked_latent_dataset.ObsActionChunkLSTMImageChunkedLatentDataset
  zarr_path: data/swap_t_dataset_320.zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.02
  max_train_episodes: null
  lstm_checkpoint_path: ${lstm_checkpoint_path}
  action_step_subsample: ${action_step_subsample}
  lstm_latent_type: ${lstm_latent_type}
  device: ${training.device}
