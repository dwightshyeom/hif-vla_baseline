defaults:
  - _self_

name: train_obs_action_chunk_lstm_image
_target_: memory_diffusion_policy.workspace.train_obs_action_chunk_lstm_image_workspace.TrainObsActionChunkLSTMImageWorkspace

# All keys below are forwarded to memory_diffusion_policy/workspace/
# train_obs_action_chunk_lstm_image_workspace.py::run_lstm_pretrain_image via an
# argparse.Namespace.  Override on the command line, e.g.
#   python train.py --config-name=train_obs_action_chunk_lstm_image_workspace \
#     lstm_pretrain.zarr_path=data/pusht_2d_friction_demos_320.zarr \
#     lstm_pretrain.dataset_class=memory_diffusion_policy.dataset.pusht_friction_image_dataset.PushTFrictionImageDataset \
#     lstm_pretrain.batch_size=8 lstm_pretrain.num_epochs=2
lstm_pretrain:
  zarr_path: data/swap_t_dataset_320.zarr
  dataset_class: memory_diffusion_policy.dataset.pusht_two_swap_image_dataset.PushTTwoSwapImageDataset
  val_ratio: 0.15
  seed: 42

  # Action step alignment with DP — set to DP n_action_steps; 1 = no subsampling
  action_step_subsample: 1

  # Visual encoder
  crop_shape: [76, 76]
  obs_encoder_group_norm: true
  eval_fixed_crop: true
  freeze_encoder: false
  num_kp: 32

  # Model architecture
  hidden_size: 64
  num_layers: 2
  dropout: 0.1

  # Future action chunk head
  use_future_head: false
  chunk_H: 16
  num_future_modes: 1
  future_abstraction: raw
  future_n_bases: 32
  future_dct_freq_decay: 0.0
  future_mode_cls_weight: 0.1
  future_entropy_weight: 0.01

  # Past action chunk head
  use_past_head: true
  past_chunk_H: 300
  past_abstraction: dct
  past_n_bases: 32
  past_dct_freq_decay: 0.0
  past_temporal_weight: uniform
  past_temporal_alpha: 1.0
  past_consistency_weight: 1
  past_consistency_n_steps: [1, 2, 4, 8, 16, 32, 64, 128, 256]

  # VQ bottleneck (off by default)
  use_vq: false
  vq_n_codes: 512
  vq_commitment_weight: 0.25

  # Loss weights
  future_loss_weight: 1.0
  past_loss_weight: 1.0
  l1_on_hidden_state: true
  l1_weight: 0.1

  # Action noise augmentation
  action_noise_scale: 0.1
  action_dropout_prob: 0.05
  action_noise_warmup: 50

  # Training
  batch_size: 16
  num_epochs: 1000
  lr: 0.0001
  device: cuda
  num_workers: 4

  # Output (left empty by default; the workspace overrides this with the
  # hydra-managed output_dir so checkpoints land alongside DP runs)
  output_dir: null

  # Logging
  log_mode: wandb
  log_per_step: true
  use_wandb: false
  wandb_project: obs_action_chunk_lstm_image
  wandb_entity: null
  wandb_run_name: null

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
    subdir: ${hydra.job.num}
