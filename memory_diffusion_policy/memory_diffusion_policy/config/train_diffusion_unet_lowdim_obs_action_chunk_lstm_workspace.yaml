defaults:
  - _self_
  - task: pusht_three_goals_lowdim_obs_action_chunk_lstm

name: train_diffusion_unet_lowdim
_target_: memory_diffusion_policy.workspace.train_diffusion_unet_lowdim_workspace.TrainDiffusionUnetLowdimWorkspace

action_dim: ${task.action_dim}
keypoint_dim: ${task.keypoint_dim}
task_name: ${task.name}
exp_name: "default"

horizon: 8
n_obs_steps: 1
n_action_steps: 4
n_latency_steps: 0
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_local_cond: False
obs_as_global_cond: True
pred_action_steps_only: True

# ---- LSTM hidden-state projection toggle ----
# Set use_hidden_projection to true to reduce hidden dim via learnable layers.
# When false, the raw LSTM hidden state (or VQ'd hidden) is used directly.
use_hidden_projection: true #false #true
# projection_concat: false = project hidden then concat with obs
#                    true  = concat obs+hidden first, then project together
projection_concat: false 
projection_output_dim: 40
projection_num_layers: 2 #2
lstm_hidden_size: 128 #64 #512
raw_obs_dim: 74 #20

# ---- LSTM conditioning latent type ----
# 'hidden'              – use raw LSTM hidden state as conditioning (default)
# 'past_dct_coeff'      – use DCT coefficients from the pretrained past_chunk_head.
# 'future_action'       – use predicted future actions from future_chunk_head.
# 'hidden+future_action'– use both hidden state AND future action prediction,
#   each processed independently through their own VQ/MLP projection, then
#   concatenated with obs. In this mode lstm_hidden_size tracks the hidden
#   stream only and future_action_dim is computed automatically from the
#   LSTM checkpoint (chunk_H * action_dim * num_future_modes).
lstm_latent_type: 'future_action'  # 'hidden' | 'past_dct_coeff' | 'future_action' | 'hidden+future_action'

# Set to true ONLY when lstm_latent_type is 'hidden+future_action'.
# Controls whether the future-action stream dimension is added to obs_dim.
include_future_action_in_obs: false

# ---- Future-action stream settings (for 'hidden+future_action' mode) ----
use_future_action_projection: true
future_action_projection_output_dim: 20
future_action_projection_num_layers: 2
use_future_action_vq: false
future_action_vq_num_embeddings: 128
future_action_vq_commitment_weight: 0.25
# future_action_dim is computed automatically from the LSTM checkpoint.
# For raw future with chunk_H=16, action_dim=2, num_modes=1: 16*2*1 = 32
future_action_dim: 32  # override if needed

# ---- Observation projection toggle ----
# Set use_obs_projection to true to reduce high-dim obs via learnable MLP.
# Useful when goal keypoints make the raw obs very high-dimensional.
use_obs_projection: true #false
obs_projection_output_dim: 20
obs_projection_num_layers: 2

# ---- Goal keypoints toggle ----
# Set to true to include 3 goal T keypoints (54 extra dims) in observation.
# When true, raw_obs_dim should be 74 (20 base + 54 goal kps).
# Must match the LSTM pretraining setting for consistency.
include_goal_keypoints: true #false

# ---- Goal variation (must match demo collection settings) ----
# For data collected with: --goal_pos_variation 30 --goal_rot_variation 0.3
# set these to 30.0 and 0.3 respectively.
goal_pos_variation: 30.0
goal_rot_variation: 0.3

# ---- Vector Quantization toggle ----
# Set use_vq to true to discretize the LSTM hidden state via a learned codebook.
# Pipeline: hidden → VQ (at lstm_hidden_size dim) → project → concat with obs.
use_vq: true #true
vq_num_embeddings: 128
vq_commitment_weight: 0.25
vq_loss_weight: 1.0

# obs_dim is computed automatically based on the projection toggles:
#   obs_effective = obs_projection_output_dim if use_obs_projection else raw_obs_dim
#   hidden_effective = projection_output_dim if use_hidden_projection else lstm_hidden_size
#   projection_concat + use_hidden_projection -> obs_dim = projection_output_dim
#   For 'hidden+future_action' mode, add:
#     fa_effective = future_action_projection_output_dim if use_future_action_projection else future_action_dim
_obs_effective: "${eval: ${obs_projection_output_dim} if ${use_obs_projection} else ${raw_obs_dim}}"
_hidden_effective: "${eval: ${projection_output_dim} if ${use_hidden_projection} else ${lstm_hidden_size}}"
_fa_effective: "${eval: ${future_action_projection_output_dim} if ${use_future_action_projection} else ${future_action_dim}}"
_base_obs_dim: "${eval: ${projection_output_dim} if ${use_hidden_projection} and ${projection_concat} else ${_obs_effective} + ${_hidden_effective}}"
obs_dim: "${eval: ${_base_obs_dim} + ${_fa_effective} if ${include_future_action_in_obs} else ${_base_obs_dim}}"

policy:
  _target_: memory_diffusion_policy.policy.diffusion_unet_lowdim_policy_with_obs_action_chunk_lstm.DiffusionUnetLowdimPolicyWithObsActionChunkLSTM

  model:
    _target_: memory_diffusion_policy.model.diffusion.conditional_unet1d.ConditionalUnet1D
    input_dim: "${eval: ${action_dim} if ${obs_as_local_cond} or ${obs_as_global_cond} else ${obs_dim} + ${action_dim}}"
    local_cond_dim: "${eval: ${obs_dim} if ${obs_as_local_cond} else None}"
    global_cond_dim: "${eval: ${obs_dim}*${n_obs_steps} if ${obs_as_global_cond} else None}"
    diffusion_step_embed_dim: 256
    down_dims: [256, 512, 1024]
    kernel_size: 5
    n_groups: 8
    cond_predict_scale: True

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small
    clip_sample: True
    prediction_type: epsilon

  horizon: ${horizon}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 100
  obs_as_local_cond: ${obs_as_local_cond}
  obs_as_global_cond: ${obs_as_global_cond}
  pred_action_steps_only: ${pred_action_steps_only}
  oa_step_convention: True
  raw_obs_dim: ${raw_obs_dim}

  # LSTM conditioning latent type (must match the dataset setting)
  lstm_latent_type: ${lstm_latent_type}

  # Pretrained ObsActionChunkLSTM — hidden states condition the DP
  lstm_checkpoint_path: "outputs/obs_action_chunk_lstm_varying_goal_past_dct_future_raw_actions/best_model.pt"
  lstm_hidden_size: ${lstm_hidden_size}

  # Hidden projection: controlled by top-level use_hidden_projection toggle
  use_hidden_projection: ${use_hidden_projection}
  projection_output_dim: "${eval: ${projection_output_dim} if ${use_hidden_projection} else None}"
  projection_num_layers: ${projection_num_layers}
  projection_concat: ${projection_concat}

  # Observation projection: controlled by top-level use_obs_projection toggle
  use_obs_projection: ${use_obs_projection}
  obs_projection_output_dim: ${obs_projection_output_dim}
  obs_projection_num_layers: ${obs_projection_num_layers}

  # Vector Quantization: controlled by top-level use_vq toggle
  use_vq: ${use_vq}
  vq_num_embeddings: ${vq_num_embeddings}
  vq_commitment_weight: ${vq_commitment_weight}
  vq_loss_weight: ${vq_loss_weight}

  # Future-action stream projection/VQ (for 'hidden+future_action' mode)
  use_future_action_projection: ${use_future_action_projection}
  future_action_projection_output_dim: ${future_action_projection_output_dim}
  future_action_projection_num_layers: ${future_action_projection_num_layers}
  use_future_action_vq: ${use_future_action_vq}
  future_action_vq_num_embeddings: ${future_action_vq_num_embeddings}
  future_action_vq_commitment_weight: ${future_action_vq_commitment_weight}

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 256
  num_workers: 1
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 256
  num_workers: 1
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  # optimisation
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 500000000
  gradient_accumulate_every: 1
  use_ema: True
  # training loop control (in epochs)
  rollout_every: 50
  checkpoint_every: 50
  val_every: 1
  sample_every: 5
  # steps per epoch
  max_train_steps: null
  max_val_steps: null
  # misc
  tqdm_interval_sec: 1.0

logging:
  project: diffusion_policy_debug
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 5
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
